services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-rag-api
    ports:
      - "8000:8000"
    volumes:
      - ./vector_store:/app/vector_store
      - ./data:/app/data
      - ./mlruns:/app/mlruns
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  rag-ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: financial-rag-ui
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://rag-api:8000
    depends_on:
      - rag-api
    restart: unless-stopped

 mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: financial-rag-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    environment:
      - MLFLOW_ALLOW_FILE_STORE=true
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns
    restart: unless-stopped
